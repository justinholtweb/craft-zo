    <rect x="12" y="58" width="76" height="1.4"/>
    <rect x="12" y="66" width="76" height="1.4"/>
    <rect x="12" y="74" width="76" height="1.4"/>
    <rect x="12" y="82" width="76" height="1.4"/>
